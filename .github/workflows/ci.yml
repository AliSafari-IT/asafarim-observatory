name: Observatory checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read

jobs:
  originating-issue:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/check-issue.test.mjs
      - run: node scripts/check-issue.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          GITHUB_TOKEN: ${{ github.token }}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t observatory-ci .
      - run: docker run --rm --entrypoint /app/bin/observatory-api observatory-ci -version
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_prune_snapshots.py'
      - run: sh scripts/check.sh
      - run: go test -race ./...
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:env
      - run: pnpm test:gateway
      - run: pnpm build
      - run: pnpm --dir dashboard exec playwright install --with-deps chromium
      - run: pnpm --dir dashboard test:browser
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container, check, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://observatory.asafarim.site/
    concurrency:
      group: observatory-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        env:
          OBSERVATORY_DEPLOY_HOST: ${{ secrets.OBSERVATORY_DEPLOY_HOST }}
          OBSERVATORY_DEPLOY_USER: ${{ secrets.OBSERVATORY_DEPLOY_USER }}
          OBSERVATORY_DEPLOY_PORT: ${{ secrets.OBSERVATORY_DEPLOY_PORT }}
          OBSERVATORY_DEPLOY_SSH_KEY: ${{ secrets.OBSERVATORY_DEPLOY_SSH_KEY }}
          OBSERVATORY_DEPLOY_KNOWN_HOSTS: ${{ secrets.OBSERVATORY_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OBSERVATORY_DEPLOY_HOST" || { echo "::error::Missing production secret OBSERVATORY_DEPLOY_HOST"; exit 1; }
          test -n "$OBSERVATORY_DEPLOY_USER" || { echo "::error::Missing production secret OBSERVATORY_DEPLOY_USER"; exit 1; }
          test -n "$OBSERVATORY_DEPLOY_SSH_KEY" || { echo "::error::Missing production secret OBSERVATORY_DEPLOY_SSH_KEY"; exit 1; }
          test -n "$OBSERVATORY_DEPLOY_KNOWN_HOSTS" || { echo "::error::Missing production secret OBSERVATORY_DEPLOY_KNOWN_HOSTS"; exit 1; }
          [[ "$OBSERVATORY_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::Invalid production host format"; exit 1; }
          [[ "$OBSERVATORY_DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid production user format"; exit 1; }
          port="${OBSERVATORY_DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Invalid production SSH port"; exit 1; }
          port_number=$((10#$port))
          (( port_number >= 1 && port_number <= 65535 )) || { echo "::error::Invalid production SSH port"; exit 1; }
      - name: Build revision-tagged production image
        run: docker build --build-arg OBSERVATORY_BUILD_REVISION="$GITHUB_SHA" --tag "asafarim-observatory:$GITHUB_SHA" .
      - name: Save compressed image archive
        run: docker save "asafarim-observatory:$GITHUB_SHA" | gzip --fast > "$RUNNER_TEMP/observatory-$GITHUB_SHA.tar.gz"
      - name: Configure pinned SSH connection
        id: configure_ssh
        shell: bash
        env:
          OBSERVATORY_DEPLOY_SSH_KEY: ${{ secrets.OBSERVATORY_DEPLOY_SSH_KEY }}
          OBSERVATORY_DEPLOY_KNOWN_HOSTS: ${{ secrets.OBSERVATORY_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$OBSERVATORY_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/observatory-deploy-key"
          printf '%s\n' "$OBSERVATORY_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/observatory-known-hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/observatory-deploy-key" >/dev/null
      - name: Transfer image and deploy
        shell: bash
        env:
          OBSERVATORY_DEPLOY_HOST: ${{ secrets.OBSERVATORY_DEPLOY_HOST }}
          OBSERVATORY_DEPLOY_USER: ${{ secrets.OBSERVATORY_DEPLOY_USER }}
          OBSERVATORY_DEPLOY_PORT: ${{ secrets.OBSERVATORY_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          port="${OBSERVATORY_DEPLOY_PORT:-22}"
          remote="$OBSERVATORY_DEPLOY_USER@$OBSERVATORY_DEPLOY_HOST"
          archive="/tmp/observatory-$GITHUB_SHA.tar.gz"
          remote_script="/tmp/observatory-deploy-$GITHUB_SHA.sh"
          ssh_options=(-i "$RUNNER_TEMP/observatory-deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/observatory-known-hosts")
          scp -P "$port" "${ssh_options[@]}" "$RUNNER_TEMP/observatory-$GITHUB_SHA.tar.gz" "$remote:$archive"
          scp -P "$port" "${ssh_options[@]}" scripts/deploy-production.sh "$remote:$remote_script"
          ssh -p "$port" "${ssh_options[@]}" "$remote" "bash '$remote_script' '$GITHUB_SHA'"
      - name: Verify public endpoint serves this revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors --max-time 10 https://observatory.asafarim.site/healthz)"
          HEALTH_RESPONSE="$health" node --input-type=module -e '
            const health = JSON.parse(process.env.HEALTH_RESPONSE);
            if (health.status !== "ok" || health.revision !== process.env.EXPECTED_REVISION) {
              console.error(`Production health check did not confirm revision ${process.env.EXPECTED_REVISION}.`);
              process.exit(1);
            }
          '
      - name: Remove temporary files from production
        if: always() && steps.configure_ssh.outcome == 'success'
        shell: bash
        env:
          OBSERVATORY_DEPLOY_HOST: ${{ secrets.OBSERVATORY_DEPLOY_HOST }}
          OBSERVATORY_DEPLOY_USER: ${{ secrets.OBSERVATORY_DEPLOY_USER }}
          OBSERVATORY_DEPLOY_PORT: ${{ secrets.OBSERVATORY_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          port="${OBSERVATORY_DEPLOY_PORT:-22}"
          remote="$OBSERVATORY_DEPLOY_USER@$OBSERVATORY_DEPLOY_HOST"
          ssh_options=(-i "$RUNNER_TEMP/observatory-deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/observatory-known-hosts")
          ssh -p "$port" "${ssh_options[@]}" "$remote" "rm -f -- '/tmp/observatory-$GITHUB_SHA.tar.gz' '/tmp/observatory-deploy-$GITHUB_SHA.sh'"
      - name: Remove temporary deployment files
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/observatory-deploy-key" "$RUNNER_TEMP/observatory-known-hosts" "$RUNNER_TEMP/observatory-$GITHUB_SHA.tar.gz"

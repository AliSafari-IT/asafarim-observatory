name: Go and Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh scripts/check.sh
      - run: go test -race ./...
